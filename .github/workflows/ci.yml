name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-branch-target:
    name: Guard — PR target branch
    runs-on: ubuntu-latest
    steps:
      - name: Block direct PRs into main from non-develop branches
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "❌ PR targets 'main' from '${{ github.head_ref }}'"
          echo "Only 'develop' → 'main' release PRs are allowed. Merge into 'develop' first."
          exit 1
      - name: OK
        run: echo "✅ Branch target check passed"

  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: Build (required for main)
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
